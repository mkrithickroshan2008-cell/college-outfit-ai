<!DOCTYPE html>
<html>
<head>
  <title>College Outfit AI</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      text-align: center;
      background: #f5f5f5;
    }

    h1 {
      color: #222;
    }

    input {
      margin: 20px 0;
    }

    button {
      padding: 12px 20px;
      background: black;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }

    #preview {
      display: none;
      width: 250px;
      max-width: 90%;
      margin: 20px auto;
      border-radius: 12px;
    }

    #result {
      font-size: 18px;
      font-weight: bold;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <h1>College Outfit AI</h1>

  <input
    type="file"
    id="photoInput"
    accept="image/*"
    onchange="showPhoto()"
  >

  <br><br>

  <img id="preview">

  <br>

  <button onclick="uploadPhoto()">
    Upload a photo
  </button>

  <p id="result"></p>

  <script>
    function showPhoto() {
      const photo = document.getElementById("photoInput").files[0];
      const preview = document.getElementById("preview");

      if (photo) {
        preview.src = URL.createObjectURL(photo);
        preview.style.display = "block";
      }
    }

    function uploadPhoto() {
      const photo = document.getElementById("photoInput").files[0];
      const result = document.getElementById("result");

      if (!photo) {
        result.textContent = "Please select a photo first.";
        return;
      }

      result.textContent =
        "Recommended: Black shirt + Blue jeans + White sneakers";
    }
  </script>

</body>
</html>
