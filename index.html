<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Outfit AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(100%, 520px);
      background: white;
      border-radius: 20px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }
    h1 { margin: 0 0 12px; }
    p { color: #5c6678; line-height: 1.6; }
    button {
      border: 0;
      border-radius: 12px;
      padding: 13px 20px;
      background: #172033;
      color: white;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>College Outfit AI</h1>
    <p>Your outfit recommendation app is ready to build.</p>
    <button onclick="alert('College Outfit AI is working!')">Get Started</button>
  </main>
</body>
</html>
